<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OKX Scalp Signal Bot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>OKX Scalp Signal Bot</h1>
  <div id="statusPills" class="pills"></div>
</header>

<main>
  <section class="cards" id="statCards"></section>

  <section class="panel">
    <h2>Настройки стратегии</h2>
    <p class="hint">Изменения применяются на следующем цикле скрининга без перезапуска бота.</p>
    <form id="settingsForm" class="settings-grid"></form>
    <div class="settings-actions">
      <button type="submit" form="settingsForm" id="saveBtn">Сохранить</button>
      <span id="saveStatus" class="save-status"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Ордера / сигналы</h2>
    <div class="table-wrap">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Время</th>
            <th>Пара</th>
            <th>Вход</th>
            <th>Стоп</th>
            <th>TP1</th>
            <th>TP2</th>
            <th>Плечо</th>
            <th>Маржа</th>
            <th>Скор</th>
            <th>Статус</th>
            <th>Результат</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
